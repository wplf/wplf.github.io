<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="wplf 的个人主页">
  <title>wplf 的个人主页</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #24292f;
      background: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(640px, 100%);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(140, 149, 159, 0.18);
    }

    h1 { margin: 0 0 16px; font-size: 36px; }
    p { margin: 0; color: #57606a; line-height: 1.8; }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 20px;
      color: #fff;
      background: #24292f;
      border-radius: 8px;
      text-decoration: none;
    }

    a:hover { background: #0969da; }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是 wplf 👋</h1>
    <p>欢迎来到我的个人主页。<br>我对编程、技术和创造有趣的项目感兴趣。</p>
    <a href="https://github.com/wplf">查看我的 GitHub</a>
  </main>
</body>
</html>
